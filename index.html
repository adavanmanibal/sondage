<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repas de fin d'année · Choix du menu</title>
<meta name="description" content="Choisissez votre entrée, votre plat et votre dessert pour le repas de fin d'année.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5efe3;
    --card: #fffdf8;
    --ink: #1c2622;
    --muted: #6d6f66;
    --line: #e4d9c6;
    --green: #1d4a3a;
    --green-soft: #e8f0eb;
    --gold: #b6873a;
    --gold-soft: #f4e8d2;
    --red: #a63d32;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "DM Sans", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% -10%, #fbf7ee 0, transparent 45%),
      radial-gradient(circle at 110% 10%, #efe4cf 0, transparent 40%),
      var(--bg);
    min-height: 100vh;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 18px 64px; }

  .demo {
    background: var(--gold-soft); border: 1px dashed var(--gold);
    border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 20px;
  }

  header { text-align: center; padding: 18px 0 30px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--gold); font-weight: 700;
  }
  .eyebrow svg { width: 14px; height: 14px; fill: var(--gold); }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: clamp(34px, 8vw, 54px); line-height: 1.05;
    margin: 12px 0 14px; color: var(--green);
  }
  .intro { color: var(--muted); max-width: 520px; margin: 0 auto; font-size: 16px; }
  .flou {
    display: inline-block; padding: 0 4px; font-weight: 700; color: var(--green);
    filter: blur(3.5px); user-select: none; -webkit-user-select: none; cursor: help;
  }
  .lieu { font-weight: 700; color: var(--green); }
  .deadline {
    display: inline-block; margin-top: 16px;
    background: var(--green); color: #fff;
    padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500;
  }
  .deadline.clos { background: var(--red); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 26px 22px; margin-bottom: 22px;
    box-shadow: 0 1px 0 #fff inset, 0 12px 30px -18px rgba(29, 74, 58, .35);
  }
  h2 { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 24px; margin: 0 0 4px; color: var(--green); }
  .muted { color: var(--muted); font-size: 14px; margin: 0; }

  /* Choix du nom */
  .select-wrap { position: relative; margin-top: 16px; }
  select {
    width: 100%; appearance: none; -webkit-appearance: none;
    font: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 13px 44px 13px 14px; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(29, 74, 58, .12); }
  .select-wrap::after {
    content: ""; position: absolute; right: 18px; top: 50%; width: 9px; height: 9px;
    border-right: 2px solid var(--green); border-bottom: 2px solid var(--green);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  .status { margin-top: 10px; font-size: 14px; min-height: 1.5em; }
  .status.ok { color: var(--green); font-weight: 500; }
  .status.wait { color: var(--gold); }

  /* Menu */
  .menu-head { text-align: center; margin-bottom: 6px; }
  .menu-head h2 { font-size: 30px; }
  .course { margin-top: 38px; }
  .course:first-child { margin-top: 22px; }
  .course-opts {
    background: #f7f1e6; border: 1px solid var(--line); border-radius: 16px; padding: 10px;
  }
  .course-title {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold);
    margin-bottom: 10px;
  }
  .course-title::before, .course-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .ou {
    text-align: center; font-family: "Fraunces", Georgia, serif; font-style: italic;
    color: var(--muted); font-size: 13px; line-height: 1; margin: 5px 0;
  }
  .opt { position: relative; display: block; cursor: pointer; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt-body {
    display: flex; gap: 14px; align-items: flex-start;
    border: 1.5px solid var(--line); border-radius: 14px; background: #fff;
    padding: 14px 16px; transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .opt-radio {
    flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%;
    border: 1.5px solid #cfc4b1; display: grid; place-items: center; transition: all .15s;
  }
  .opt-radio svg { width: 13px; height: 13px; stroke: #fff; opacity: 0; }
  .opt-titre { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 18px; line-height: 1.25; color: var(--ink); }
  .opt-desc { font-size: 14px; color: var(--muted); margin-top: 3px; }
  .opt:hover .opt-body { border-color: var(--green); }
  .opt input:focus-visible + .opt-body { box-shadow: 0 0 0 4px rgba(29, 74, 58, .18); }
  .opt input:checked + .opt-body { border-color: var(--green); background: var(--green-soft); }
  .opt input:checked + .opt-body .opt-radio { background: var(--green); border-color: var(--green); }
  .opt input:checked + .opt-body .opt-radio svg { opacity: 1; }
  .opt input:checked + .opt-body .opt-titre { color: var(--green); }
  .opt input:disabled + .opt-body { cursor: default; }
  .opt input:disabled:not(:checked) + .opt-body { opacity: .55; }
  .opt:has(input:disabled):hover .opt-body { border-color: var(--line); }
  .opt:has(input:disabled:checked):hover .opt-body { border-color: var(--green); }

  .actions { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
  button.primary {
    font: inherit; font-weight: 700; font-size: 16px; background: var(--green); color: #fff;
    border: 0; border-radius: 12px; padding: 15px 18px; cursor: pointer; transition: background .15s, transform .1s;
  }
  button.primary:hover { background: #163a2d; }
  button.primary:active { transform: scale(.99); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  .msg { font-size: 15px; min-height: 1.4em; }
  .msg.ok { color: var(--green); font-weight: 500; }
  .msg.err { color: var(--red); }

  /* Récap */
  .results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .link-btn {
    font: inherit; font-size: 14px; color: var(--green); background: none; border: 0; padding: 0;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .progress { margin: 16px 0 4px; }
  .progress-top { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
  .bar { height: 10px; background: #efe8da; border-radius: 999px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width .5s ease; }
  .totaux { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
  .tot {
    border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #fff;
  }
  .tot h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .tot-row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 3px 0; }
  .tot-row strong { font-family: "Fraunces", Georgia, serif; font-size: 18px; color: var(--green); line-height: 1.1; }
  .attente { margin-top: 18px; font-size: 14px; }
  .attente-titre { font-weight: 700; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--gold-soft); color: #7d5a1f; border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .table-wrap { overflow-x: auto; margin-top: 22px; border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  td.vide { color: #c9bfae; }
  tr.moi td { background: var(--green-soft); }
  .empty { text-align: center; color: var(--muted); padding: 18px 0 4px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; }

  /* Fond vidéo / photo plein écran */
  .bg { display: none; position: fixed; inset: 0; z-index: -1; background: #16211c; overflow: hidden; }
  body.has-bg .bg { display: block; }
  .bg video, .bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(12, 20, 16, .55) 0%, rgba(12, 20, 16, .30) 35%, rgba(12, 20, 16, .72) 100%);
  }
  body.has-bg header {
    min-height: 78vh; min-height: 78svh;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  body.has-bg .eyebrow { color: #ecd3a4; }
  body.has-bg .eyebrow svg { fill: #ecd3a4; }
  body.has-bg h1 { color: #fff; text-shadow: 0 2px 24px rgba(0, 0, 0, .35); }
  body.has-bg .intro { color: rgba(255, 255, 255, .9); text-shadow: 0 1px 12px rgba(0, 0, 0, .4); }
  body.has-bg .lieu { color: #ecd3a4; }
  body.has-bg .deadline { background: rgba(255, 253, 248, .95); color: var(--green); }
  body.has-bg .deadline.clos { background: var(--red); color: #fff; }
  body.has-bg footer { color: rgba(255, 255, 255, .8); }
  .scroll-cue { display: none; }
  body.has-bg .scroll-cue {
    display: block; margin-top: 34px; width: 22px; height: 22px;
    border-right: 2px solid rgba(255, 255, 255, .8); border-bottom: 2px solid rgba(255, 255, 255, .8);
    transform: rotate(45deg); animation: cue 1.8s ease-in-out infinite;
  }
  @keyframes cue { 0%, 100% { transform: translateY(0) rotate(45deg); opacity: .5; } 50% { transform: translateY(8px) rotate(45deg); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { body.has-bg .scroll-cue { animation: none; } }

  @media (max-width: 560px) {
    .card { padding: 22px 16px; }
    .totaux { grid-template-columns: 1fr; }
    .opt-titre { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="wrap">

  <div class="demo" id="demo" hidden><strong>Mode démo :</strong> les choix sont enregistrés uniquement dans ce navigateur.</div>

  <header>
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>
      <span id="eyebrow"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>
    </div>
    <h1 id="titre"></h1>
    <p class="intro" id="intro"></p>
    <div class="deadline" id="deadline"></div>
    <a href="#choix-nom" class="scroll-cue" aria-label="Aller au choix du menu"></a>
  </header>

  <section class="card" id="choix-nom">
    <h2>Qui êtes-vous ?</h2>
    <p class="muted">Sélectionnez votre nom pour faire ou revoir vos choix.</p>
    <div class="select-wrap">
      <select id="nom" aria-label="Votre nom">
        <option value="">Chargement de la liste…</option>
      </select>
    </div>
    <div class="status" id="status"></div>
  </section>

  <form class="card" id="form" novalidate>
    <div class="menu-head">
      <h2>Le menu</h2>
      <p class="muted">Une entrée, un plat et un dessert au choix.</p>
    </div>
    <div id="menu"></div>
    <div class="actions">
      <button type="submit" class="primary" id="submit">Valider mon menu</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>
  </form>

  <section class="card" id="recap">
    <div class="results-head">
      <h2>Le récap</h2>
      <button type="button" class="link-btn" id="refresh">Actualiser</button>
    </div>
    <div class="progress">
      <div class="progress-top"><span>Menus choisis</span><strong id="prog-txt">–</strong></div>
      <div class="bar"><span id="prog-bar" style="width:0%"></span></div>
    </div>
    <div class="totaux" id="totaux"></div>
    <div class="attente" id="attente"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Convive</th><th>Entrée</th><th>Plat</th><th>Dessert</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <footer id="footer"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CONFIGURATION
   ========================================================= */
const CONFIG = {
  supabaseUrl: 'https://qqpihxogkxormygegjbf.supabase.co',
  supabaseKey: 'sb_publishable_kjOc4Dvsa-9s5AoddzhVgg_FpD-KPWw',
  tableMenus: 'repas_menus',
  tableParticipants: 'repas_dispos',     // la liste vient du sondage des dates
  dateRetenue: '2026-12-10',             // seuls ceux dispo ce jour-là apparaissent

  // Personnes à ajouter à la main (pas dans le sondage), ex. ['Prénom Nom']
  participantsEnPlus: [],
  // Personnes du sondage à retirer de la liste (nom tel qu'affiché)
  participantsEnMoins: [],

  eyebrow: 'Jeudi 10 décembre 2026',
  titre: "Repas de fin d'année",
  // Lieu : laissez lieuRevele à false pour garder le suspense (le texte flouté est volontairement faux)
  lieuRevele: true,
  lieuNom: 'Château d\'Artigny',
  intro: 'Rendez-vous au {lieu} le jeudi 10 décembre. Il ne reste plus qu\'à choisir votre menu !',

  // Fond plein écran : fichiers à déposer dans le même dossier que index.html sur GitHub.
  // Laissez '' pour ne pas en mettre. Si la vidéo ne se charge pas, la photo prend le relais.
  fondVideo: 'artigny.mp4',
  fondPhoto: 'artigny.jpg',

  dateLimiteTexte: 'lundi 30 novembre inclus',
  finDesChoix: '2026-12-01T00:00:00+01:00', // à partir de ce moment, plus de modification possible
  footer: 'Organisé par Adavan · une question ? passez me voir',

  menu: [
    { id: 'entree', label: 'Entrée', options: [
      { id: 'veloute', court: 'Velouté', titre: 'Velouté de courge butternut et potimarron',
        desc: "Chantilly au piment d'Espelette, gorgonzola et coppa italienne" },
      { id: 'oeuf', court: 'Œuf 64 °C', titre: 'Œuf de plein air cuit à 64 °C',
        desc: 'Panais cuisiné comme une carbonara, tuile de parmesan' },
    ]},
    { id: 'plat', label: 'Plat', options: [
      { id: 'pintade', court: 'Pintade', titre: 'Cuisse de pintade fermière cuite à basse température',
        desc: 'Fricassée de shiitakés et pleurotes aux éclats de châtaigne, pommes de terre grenaille rôties, sauce aux champignons' },
      { id: 'cabillaud', court: 'Cabillaud', titre: 'Dos de cabillaud rôti',
        desc: 'Pomme de terre écrasée façon grenobloise (citron, câpres, beurre noisette et persil), sauce au vin de Vouvray' },
    ]},
    { id: 'dessert', label: 'Dessert', options: [
      { id: 'chocolat', court: 'Chocolat-caramel', titre: 'Barre croustillante chocolat et caramel au beurre salé',
        desc: 'Sorbet poire' },
      { id: 'rizaulait', court: 'Riz au lait', titre: 'Riz au lait à la vanille',
        desc: 'Compotée de mangues et tuiles aux amandes' },
    ]},
  ],

  // Utilisé seulement en mode démo (ajoutez ?demo à l'adresse pour tester sans toucher à la base)
  demoParticipants: ['ADAM MARTIN', 'Adavan Manibal', 'charlene petitsigne', 'Christophe LOPEZ-GARCIA', 'Gaëlle Robert', 'Marie NOËL'],
};
/* ========================================================= */

const params = new URLSearchParams(location.search);
const DEMO = params.has('demo') || !/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(CONFIG.supabaseUrl);
const CLOS = params.has('clos') || Date.now() >= new Date(CONFIG.finDesChoix).getTime();
const sb = (!DEMO && window.supabase) ? window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey) : null;

const $ = (id) => document.getElementById(id);
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clean = (n) => String(n || '').replace(/\s+/g, ' ').trim();
const keyOf = (n) => clean(n).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
// « ADAM MARTIN » -> « Adam Martin », « LOPEZ-GARCIA » -> « Lopez-Garcia »
const joli = (n) => clean(n).toLocaleLowerCase('fr').replace(/(^|[\s\-'’])(\p{L})/gu, (m, sep, l) => sep + l.toLocaleUpperCase('fr'));

const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
};

let participants = [];   // [{ key, nom }]
let choix = {};          // key -> { nom, entree, plat, dessert }

/* ---------- Données ---------- */
async function fetchParticipants() {
  let noms;
  if (DEMO) {
    noms = CONFIG.demoParticipants;
  } else {
    const { data, error } = await sb.from(CONFIG.tableParticipants).select('nom, dates');
    if (error) throw error;
    noms = (data || []).filter((r) => (r.dates || []).includes(CONFIG.dateRetenue)).map((r) => r.nom);
  }
  noms = noms.concat(CONFIG.participantsEnPlus);
  const retirer = new Set(CONFIG.participantsEnMoins.map(keyOf));
  const vus = new Map();
  noms.forEach((n) => {
    const k = keyOf(n);
    if (k && !retirer.has(k) && !vus.has(k)) vus.set(k, { key: k, nom: joli(n) });
  });
  return [...vus.values()].sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
}

async function fetchChoix() {
  let rows;
  if (DEMO) {
    try { rows = JSON.parse(ls.get('menu-demo') || '[]'); } catch (e) { rows = []; }
  } else {
    const { data, error } = await sb.from(CONFIG.tableMenus).select('nom_key, nom, entree, plat, dessert');
    if (error) throw error;
    rows = data || [];
  }
  const map = {};
  rows.forEach((r) => { map[r.nom_key] = r; });
  return map;
}

async function saveChoix(row) {
  if (DEMO) {
    const all = Object.values(await fetchChoix()).filter((r) => r.nom_key !== row.nom_key);
    all.push(row);
    ls.set('menu-demo', JSON.stringify(all));
    return;
  }
  const { error } = await sb.from(CONFIG.tableMenus).upsert(row, { onConflict: 'nom_key' });
  if (error) throw error;
}

/* ---------- Fond vidéo / photo ---------- */
function setupFond() {
  const bg = $('bg');
  const calme = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sansFond = () => { document.body.classList.remove('has-bg'); bg.innerHTML = ''; };
  const photo = () => {
    if (!CONFIG.fondPhoto) return sansFond();
    const img = new Image();
    img.alt = '';
    img.onerror = sansFond;
    img.src = CONFIG.fondPhoto;
    bg.innerHTML = '';
    bg.appendChild(img);
  };
  if (!CONFIG.fondVideo && !CONFIG.fondPhoto) return;
  document.body.classList.add('has-bg');
  if (CONFIG.fondVideo && !calme) {
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    v.preload = 'auto';
    if (CONFIG.fondPhoto) v.poster = CONFIG.fondPhoto;
    v.onerror = photo;
    v.src = CONFIG.fondVideo;
    bg.appendChild(v);
    const p = v.play();
    if (p && p.catch) p.catch(() => { /* lecture auto refusée : le poster reste affiché */ });
  } else {
    photo();
  }
}

/* ---------- Page ---------- */
function setupPage() {
  setupFond();
  if (DEMO) $('demo').hidden = false;
  $('eyebrow').textContent = CONFIG.eyebrow;
  $('titre').textContent = CONFIG.titre;
  const lieu = CONFIG.lieuRevele
    ? `<span class="lieu">${esc(CONFIG.lieuNom)}</span>`
    : '<span class="flou" title="Surprise !" aria-label="lieu surprise">Château de la Surprise</span>';
  $('intro').innerHTML = esc(CONFIG.intro).replace('{lieu}', lieu);
  $('footer').textContent = CONFIG.footer;

  if (CLOS) {
    $('deadline').textContent = 'Les choix sont clos, rendez-vous le 10 décembre !';
    $('deadline').classList.add('clos');
  } else {
    $('deadline').textContent = 'Choix à faire avant le ' + CONFIG.dateLimiteTexte;
  }

  $('menu').innerHTML = CONFIG.menu.map((c) => `
    <div class="course" role="radiogroup" aria-label="${esc(c.label)}">
      <div class="course-title">${esc(c.label)}</div>
      <div class="course-opts">
      ${c.options.map((o, i) => `
        ${i > 0 ? '<div class="ou">ou</div>' : ''}
        <label class="opt">
          <input type="radio" name="${esc(c.id)}" value="${esc(o.id)}">
          <div class="opt-body">
            <span class="opt-radio">${CHECK_SVG}</span>
            <span>
              <div class="opt-titre">${esc(o.titre)}</div>
              <div class="opt-desc">${esc(o.desc)}</div>
            </span>
          </div>
        </label>`).join('')}
      </div>
    </div>`).join('');

  $('nom').addEventListener('change', onNameChange);
  $('form').addEventListener('submit', onSubmit);
  $('refresh').addEventListener('click', () => load().then(onNameChange));
  updateFormState();
}

const radios = () => Array.from(document.querySelectorAll('#menu input[type="radio"]'));
const courtDe = (courseId, optId) => {
  const c = CONFIG.menu.find((x) => x.id === courseId);
  const o = c && c.options.find((x) => x.id === optId);
  return o ? o.court : '';
};

function fillSelect() {
  const current = $('nom').value || ls.get('menu-nom') || '';
  $('nom').innerHTML = '<option value="">— Choisissez votre nom —</option>' +
    participants.map((p) => `<option value="${esc(p.key)}">${esc(p.nom)}${choix[p.key] ? ' ✓' : ''}</option>`).join('');
  if (participants.some((p) => p.key === current)) $('nom').value = current;
}

function updateFormState() {
  const hasName = !!$('nom').value;
  radios().forEach((r) => { r.disabled = CLOS; });
  $('submit').disabled = CLOS || !hasName;
  if (CLOS) $('submit').textContent = 'Les choix sont clos';
}

function onNameChange() {
  const key = $('nom').value;
  const r = key ? choix[key] : null;
  const st = $('status');
  $('msg').textContent = '';
  radios().forEach((i) => { i.checked = !!r && r[i.name] === i.value; });

  if (!key) {
    st.className = 'status';
    st.textContent = '';
    $('submit').textContent = 'Valider mon menu';
  } else if (r) {
    st.className = 'status ok';
    st.textContent = CLOS
      ? 'Voici votre menu : ' + CONFIG.menu.map((c) => courtDe(c.id, r[c.id])).join(' · ')
      : 'Votre menu est enregistré ✓ Vous pouvez encore le modifier jusqu\'au ' + CONFIG.dateLimiteTexte + '.';
    $('submit').textContent = 'Modifier mon menu';
  } else {
    st.className = 'status wait';
    st.textContent = CLOS ? 'Aucun menu enregistré pour vous.' : 'Pas encore de menu choisi, à vous de jouer !';
    $('submit').textContent = 'Valider mon menu';
  }
  if (key) ls.set('menu-nom', key);
  updateFormState();
  renderRecap();
}

async function onSubmit(e) {
  e.preventDefault();
  const msg = $('msg');
  msg.className = 'msg';
  msg.textContent = '';
  if (CLOS) return;

  const key = $('nom').value;
  const p = participants.find((x) => x.key === key);
  if (!p) {
    msg.className = 'msg err';
    msg.textContent = 'Sélectionnez d\'abord votre nom tout en haut.';
    return;
  }
  const row = { nom_key: p.key, nom: p.nom, updated_at: new Date().toISOString() };
  const manquants = [];
  CONFIG.menu.forEach((c) => {
    const sel = document.querySelector(`#menu input[name="${c.id}"]:checked`);
    if (sel) row[c.id] = sel.value; else manquants.push(c.label.toLowerCase());
  });
  if (manquants.length) {
    msg.className = 'msg err';
    msg.textContent = 'Il manque votre choix pour : ' + manquants.join(', ') + '.';
    return;
  }

  const btn = $('submit');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  try {
    await saveChoix(row);
    await load();
    onNameChange();
    msg.className = 'msg ok';
    msg.textContent = `Merci ${p.nom.split(' ')[0]} ! Votre menu est bien enregistré.`;
  } catch (err) {
    console.error(err);
    msg.className = 'msg err';
    msg.textContent = "Oups, l'enregistrement n'a pas fonctionné. Réessayez dans un instant." + (err && err.message ? ' (' + err.message + ')' : '');
    btn.disabled = false;
    btn.textContent = choix[key] ? 'Modifier mon menu' : 'Valider mon menu';
  }
}

/* ---------- Récap ---------- */
function renderRecap() {
  const total = participants.length;
  const faits = participants.filter((p) => choix[p.key]);
  $('prog-txt').textContent = `${faits.length} / ${total}`;
  $('prog-bar').style.width = total ? Math.round((faits.length / total) * 100) + '%' : '0%';

  $('totaux').innerHTML = CONFIG.menu.map((c) => `
    <div class="tot">
      <h3>${esc(c.label)}</h3>
      ${c.options.map((o) => `<div class="tot-row"><span>${esc(o.court)}</span><strong>${faits.filter((p) => choix[p.key][c.id] === o.id).length}</strong></div>`).join('')}
    </div>`).join('');

  const enAttente = participants.filter((p) => !choix[p.key]);
  $('attente').innerHTML = enAttente.length
    ? `<div class="attente-titre">${CLOS ? 'Sans menu choisi' : 'En attente'} (${enAttente.length})</div>
       <div class="chips">${enAttente.map((p) => `<span class="chip">${esc(p.nom)}</span>`).join('')}</div>`
    : (total ? '<div class="attente-titre" style="color:var(--green)">Tout le monde a choisi son menu 🎉</div>' : '');

  const moi = $('nom').value;
  $('tbody').innerHTML = faits.length ? faits.map((p) => {
    const r = choix[p.key];
    return `<tr${p.key === moi ? ' class="moi"' : ''}><td>${esc(p.nom)}</td>${CONFIG.menu.map((c) => `<td>${esc(courtDe(c.id, r[c.id]))}</td>`).join('')}</tr>`;
  }).join('') : '<tr><td colspan="4" class="empty">Les menus s\'afficheront ici.</td></tr>';
}

/* ---------- Chargement ---------- */
async function load() {
  try {
    [participants, choix] = await Promise.all([fetchParticipants(), fetchChoix()]);
    fillSelect();
  } catch (err) {
    console.error(err);
    $('nom').innerHTML = '<option value="">Impossible de charger la liste</option>';
    $('status').className = 'status';
    $('status').textContent = 'Erreur de chargement' + (err && err.message ? ' (' + err.message + ')' : '') + '. Réessayez dans un instant.';
  }
}

setupPage();
load().then(onNameChange);
</script>
</body>
</html>
